name: Upload Release Asset

on:
  release:
    types: [created, edited]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Upload Release Asset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Build with Maven
        run: mvn --batch-mode --no-transfer-progress clean package -DskipTests
      - name: Get version
        id: get_version
        run: echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> "$GITHUB_OUTPUT"
      - name: Github Release
        uses: anton-yurchenko/git-release@ec9c5b5c36b27eaffc628785b9183eae54601200 # v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: |
            target/kafka-sink-ms-fabric-${{ steps.get_version.outputs.VERSION }}-jar-with-dependencies.jar
            target/components/packages/microsoftcorporation-kafka-sink-ms-fabric-${{ steps.get_version.outputs.VERSION }}.zip
        continue-on-error: true
